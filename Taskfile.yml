version: '3'

# go install github.com/go-task/task/v3/cmd/task@latest
# zsh completions: https://github.com/sawadashota/go-task-completions

vars:
  TAG:
    sh: git describe | sed "s/^v\?\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\).*/\1/"
  VERSION: "{{base .TAG}}"
  OS_NAME: '{{ if eq OS "darwin" }}macOS{{ else }}{{OS}}{{ end }}'
  ARCH_NAME: '{{ if eq ARCH "amd64" }}amd64_v1{{ else }}{{ARCH}}{{ end }}'

env:
  C8Y_SETTINGS_CI: true
  # Version of the extension Go SDK used by "c8y extensions create --precompiled go": the newest
  # pkg/extsdk/* tag. It's passed to the build with -ldflags (see .goreleaser.yml), so tagging
  # the SDK with "task release-extsdk" is enough. If it's empty, c8y uses its default version
  C8Y_EXTSDK_VERSION:
    sh: git describe --tags --match 'pkg/extsdk/v*' --abbrev=0 2>/dev/null | sed 's|^pkg/extsdk/||' || true
  GITHUB_TOKEN: ""
  LOCAL_PATH:
    sh: |
      echo "$(pwd)/.bin:$PATH"

dotenv: ['.env', '{{.ENV}}/.env.', '{{.HOME}}/.env']

tasks:
  # ---------------------------------------------------------------
  # Helpers
  # ---------------------------------------------------------------
  show-version:
    desc: Show version
    cmds:
      - echo VERSION={{.VERSION}}

  show-vars:
    desc: Show global variables
    cmds:
      - cmd: echo OS_NAME={{.OS_NAME}}
        silent: true
      - cmd: echo ARCH_NAME={{.ARCH_NAME}}
        silent: true

  init-setup:
    desc: Initialize setup
    cmds:
      - ./scripts/setup.sh
      - pwsh -File ./scripts/build-powershell/install.ps1
  
  install-c8y:
    desc: Install c8y in dev environment
    deps:
      - build-snapshot
    cmds:
      - |
        if [ ! -f /usr/bin/c8y ]; then \
          sudo ln -s "$(pwd)/tools/PSc8y/Dependencies/c8y.linux" /usr/bin/c8y; \
        fi
        echo 'eval "$(c8y cli profile)"'  >> ~/.bashrc

        echo Installed c8y successfully

  spell-checker:
    desc: Run the spell checker
    cmds:
      - docker run --rm -v $PWD:/workdir ghcr.io/streetsidesoftware/cspell:latest "**" | tee typos.txt
      - cat typos.txt | cut -d'(' -f2 | tr -d ')' | sort | uniq -c > typos.summary.txt

  # ---------------------------------------------------------------
  # Docs
  # ---------------------------------------------------------------
  docs:
    desc: Update all docs
    deps:
      - docs-powershell
      - docs-c8y
  
  docs-powershell:
    desc: Update the powershell docs
    cmds:
      - env C8Y_BINARY='{{joinPath .ROOT_DIR ".bin" "c8y"}}' pwsh -File ./scripts/build-powershell/build-docs.ps1 -Recreate -OutputFolder "docs/go-c8y-cli/docs/cli/psc8y"
  
  docs-c8y:
    desc: create c8y documentation
    env:
      # ignore any extensions which maybe be used on the host
      C8Y_SETTINGS_EXTENSIONS_DATADIR: /tmp/dummy
    cmds:
      - go run ./cmd/gen-docs --website --doc-path "docs/go-c8y-cli/docs/cli/c8y"

  docs-check:
    desc: Check docusaurus MDX compatibility
    cmds:
      - npx docusaurus-mdx-checker
    dir: docs/go-c8y-cli

  manpages:
    desc: create c8y man packages
    cmds:
      - go run ./cmd/gen-docs --man-page --doc-path "./share/man/man1/"


  # ---------------------------------------------------------------
  # Github pages
  # ---------------------------------------------------------------
  gh-pages-install:
    desc: Install github pages dependencies for viewing docs locally
    cmds:
      - cd docs/go-c8y-cli && npm install

  gh-pages:
    desc: Run github pages locally
    cmds:
      - cd docs/go-c8y-cli && npm start
    deps:
      - build-gh-pages

  build-gh-pages:
    desc: build github pages
    dir: docs/go-c8y-cli
    cmds:
      - npm install
      - npm run write-translations
      - npm run build

  gh-pages-prod:
    desc: build/serve github pages (production)
    dir: docs/go-c8y-cli
    cmds:
      - npm run serve
    deps:
      - build-gh-pages


  # ---------------------------------------------------------------
  # Spec and code generation
  # ---------------------------------------------------------------
  update-spec:
    desc: Update json specifications
    cmds:
      - ./scripts/generate-spec.sh
    sources:
      - api/spec/yaml/*.yaml
      - ./scripts/generate-spec.sh
    generates:
      - api/spec/json/*.json
  
  generate-go-code:
    desc: Generate go code from specifications
    cmds:
      - go run ./cmd/gen-cli
    deps:
      # Use deps so that the source/generates works properly
      - update-spec
    sources:
      - api/spec/json/*.json
      - cmd/gen-cli/main.go
      - internal/codegen/*.go
    generates:
      - pkg/cmd/**/*.auto.go

  generate-go-code-check:
    desc: Verify the generated go code is up to date with the specifications
    cmds:
      - go run ./cmd/gen-cli -check

  generate-cli-tests:
    desc: Generate CLI tests from the examples in the api specs
    cmds:
      - chmod +x ./scripts/build-cli-tests.sh
      - ./scripts/build-cli-tests.sh
    sources:
      - cmd/gen-tests/main.go
      - api/spec/yaml/*.yaml
    generates:
      - tests/auto/**/tests/*.yaml

  # ---------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------
  lint:
    desc: Lint
    cmds:
      - golangci-lint run

  # ---------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------
  build-fast:
    desc: Build Fast
    vars:
      OUTPUT: .bin/c8y
      GIT_BRANCH:
        sh: git rev-parse --abbrev-ref HEAD
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    env:
      GOOS: "{{.GOOS | default OS}}"
      GOARCH: "{{.GOARCH | default ARCH}}"
    cmds:
      - echo "GOOS=$GOOS, GOARCH=$GOARCH"
      - go build -o {{.OUTPUT}} -ldflags="-s -w -X 'github.com/reubenmiller/go-c8y-cli/v2/pkg/cmd.buildVersion={{trimPrefix "v" .VERSION}}' -X 'github.com/reubenmiller/go-c8y-cli/v2/pkg/cmd.buildBranch={{.GIT_BRANCH}}' -X 'github.com/reubenmiller/go-c8y-cli/v2/pkg/cmd/extension.extSDKVersion=$C8Y_EXTSDK_VERSION'" cmd/c8y/main.go

  build:
    desc: Build
    cmds:
      - goreleaser build --clean
  
  build-snapshot:
    desc: Build Snapshot
    cmds:
      - goreleaser build --clean --snapshot --timeout 2h {{.CLI_ARGS}}

  release-snapshot:
    desc: Release snapshot (useful to test building everything including the containers)
    cmds:
      - goreleaser release --clean --snapshot {{.CLI_ARGS}}

  build-snapshot-single:
    desc: Build Snapshot (single) for the current operating system
    cmds:
      - goreleaser build --clean --snapshot --single-target --id {{.OS_NAME}} {{.CLI_ARGS}}
      - rm -f .bin/c8y
      - mkdir -p .bin
      - cp dist/{{.OS_NAME}}_{{OS}}_{{.ARCH_NAME}}*/bin/c8y .bin/c8y

  generate:
    desc: Generate the cli code
    cmds:
      - go mod tidy
      - task: update-spec
      - task: generate-go-code
      - task: generate-cli-tests
      - task: build-powershell
      - task: manpages
      - task: build-completions
      - task: checkout-addons

  build-powershell:
    desc: Build the powershell module
    cmds:
      - go run ./cmd/gen-powershell
      - rm -Rf output_pwsh
      - mkdir -p output_pwsh
      - cp -R tools/PSc8y/dist/PSc8y output_pwsh/
    sources:
      - api/spec/json/*.json
      - cmd/gen-powershell/main.go
      - internal/codegen/*.go
      - internal/codegen/powershell/**/*
      - tools/PSc8y/Public-manual/*.ps1
      - tools/PSc8y/Private/*.ps1
      - tools/PSc8y/completions/*.ps1
      - tools/PSc8y/utilities/*.ps1
      - tools/PSc8y/tools/*.ps1
    generates:
      - tools/PSc8y/**/*.ps1
      - output_pwsh/PSc8y
      - output_pwsh/PSc8y.zip

  build-powershell-check:
    desc: Verify the generated powershell cmdlets and tests are up to date with the specifications
    cmds:
      - go run ./cmd/gen-powershell -check

  build-powershell-tree:
    desc: |
      Project powershell cmdlets from the live command tree (the hand-written
      commands), not the REST spec. Scope with CLI_ARGS, e.g.
      `task build-powershell-tree -- --command devices --module tmp/psc8y-tree`.
      See docs/proposals (CLI_CODEGEN_INVERSION) for the inverted pipeline.
    cmds:
      - go run ./cmd/gen-powershell --from-tree {{.CLI_ARGS}}

  gen-surface:
    desc: |
      Dump the projection-neutral CLI surface (commands, flags, metadata) as
      JSON by walking the live command tree. Scope/redirect with CLI_ARGS, e.g.
      `task gen-surface -- --command devices --out tmp/surface.json`.
      The seam projectors and CI diffs consume (CLI_CODEGEN_INVERSION).
    cmds:
      - go run ./cmd/gen-surface {{.CLI_ARGS}}

  build-completions:
    desc: Build completions
    env:
      OUTPUT_DIR: ./output
    cmds:
      - ./tools/shell/completion/build_completions.sh
  
  build-powershell-completions:
    desc: Build powershell completions
    summary: |
      Do not trigger when building in CI/CD as it needs a already build module to work.
      The file should be run manually in development and the output should then be committed
      so it is included in the next build.
    cmds:
      -  pwsh -File tools/PSc8y/tools/build.completions.ps1

  checkout-addons:
    desc: Checkout the go-c8y-cli-addons repository
    env:
      OUTPUT_DIR: ./output
    cmds:
      - ./tools/shell/addons/checkout_addons.sh

  # ---------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------
  test-powershell:
    desc: Run powershell tests
    cmds:
      - env C8Y_BINARY='{{joinPath .ROOT_DIR ".bin" "c8y"}}' pwsh -ExecutionPolicy bypass -NonInteractive -File tools/PSc8y/test.ps1

  install-test-dependencies:
    desc: Install test dependencies
    cmds:
      - go install github.com/reubenmiller/commander/v3/cmd/commander@v3.0.2
    status:
      - command -v commander && commander test --help

  test-cli:
    desc: Test cli tests
    cmds:
      - task: test-cli-auto
      - task: test-cli-manual

  test-cli-manual:
    desc: Run manual cli tests
    summary: |
      # Run manual cli tests

      Usage:
        task test-cli-manual -- [subcommand]

      Example
        task test-cli-manual -- configuration
    deps: [install-test-dependencies]
    vars:
      FILTER: "*"
    cmds:
      - task: build-extension-fixtures
      - env PATH="$LOCAL_PATH" ./tests/run-manual.sh {{.CLI_ARGS}}
  
  test-cli-auto:
    desc: Run auto generated cli tests
    summary: |
      Additional arguments can be run using
      task test-cli-auto -- software 
    deps: [install-test-dependencies]
    cmds:
      - env PATH="$LOCAL_PATH" ./tests/scripts/setup.sh
      - env PATH="$LOCAL_PATH" ./tests/run-auto.sh {{.CLI_ARGS}}

  test-cli-offline:
    desc: Run the dry-run cli tests against the go-c8y fake server (no tenant needed)
    summary: |
      Builds c8y and the go-c8y fake server (cmd/c8y-fakeserver, from the go-c8y
      version in go.mod), creates the test data on the fake server and runs
      tests/auto against it.

      Additional arguments can be run using
      task test-cli-offline -- software
    deps: [install-test-dependencies]
    cmds:
      - go build -o .bin/c8y ./cmd/c8y
      - env PATH="$LOCAL_PATH" ./tests/run-offline.sh {{.CLI_ARGS}}

  test-go-offline:
    desc: Run the go unit tests, including cmd/tests against the go-c8y fake server (no tenant needed)
    summary: |
      Runs go test (default ./...) with the go-c8y fake server and its test data
      configured, so the cmd/tests packages (which skip without C8Y_HOST) run too.

      Other packages or go test flags can be given using
      task test-go-offline -- ./pkg/... -run Test_Body
    cmds:
      - go build -o .bin/c8y ./cmd/c8y
      - env PATH="$LOCAL_PATH" C8Y_OFFLINE_SUITE=go ./tests/run-offline.sh {{.CLI_ARGS}}

  test-cli-offline-realtime:
    desc: Run the realtime (subscribe) cli tests against the go-c8y fake server
    deps: [install-test-dependencies]
    cmds:
      - go build -o .bin/c8y ./cmd/c8y
      - |
        for suite in alarms/subscribe events/subscribe measurements/subscribe inventory/subscribe realtime; do
          env PATH="$LOCAL_PATH" C8Y_OFFLINE_SUITE=manual ./tests/run-offline.sh "$suite" || exit 1
        done

  test-cli-offline-manual:
    desc: Run the manual cli tests that pass against the go-c8y fake server (whole folders, plus single files of the other folders)
    summary: |
      The folders run in full. Of the other folders only the listed files or
      sub folders pass against the fake server (the rest need a tenant feature
      or a response which the fake server does not have, e.g. the platform's
      error texts, devices-only queries or the allTenantsSummary array); the
      realtime folder runs in test-cli-offline-realtime.

      The suites in the second loop expect https self links and are run
      against the fake server in TLS mode (C8Y_OFFLINE_TLS=1, self-signed).
    deps: [install-test-dependencies, build-extension-fixtures]
    cmds:
      - go build -o .bin/c8y ./cmd/c8y
      - |
        for suite in \
          activitylog agents alarms alias applications assert auditrecords binaries bulkoperations cache completion databroker \
          devicegroups devicemanagement deviceprofiles deviceregistration devices events fileguard firmware identity \
          measurements microservices operations pipeline retentionrules sessions settings smartgroups software template \
          tenantoptions tenants usergroups users util version \
          inventory/wait.yaml inventory/assert inventory/parents inventory/find inventory/update inventory/additions \
          ui; do
          env PATH="$LOCAL_PATH" C8Y_OFFLINE_SUITE=manual ./tests/run-offline.sh "$suite" || exit 1
        done
      - |
        for suite in \
          configuration userreferences \
          common/common.yaml common/disable_commands common/filter common/flag_customQuery.yaml common/flag_data.yaml \
          common/flags common/output common/outputTemplate common/paging common/pipe common/pipe.yaml \
          common/queryEncoding.yaml common/relative_datetime.yml common/errors/errors_command.yaml \
          common/select/select_context_shaping.yaml common/select/select_special_cases.yaml; do
          env PATH="$LOCAL_PATH" C8Y_OFFLINE_TLS=1 C8Y_OFFLINE_SUITE=manual ./tests/run-offline.sh "$suite" || exit 1
        done

  test-cli-offline-extensions:
    desc: Run the extension (runtime command) cli tests against the go-c8y fake server, using the c8y-kitchensink test extension
    summary: |
      Runs every extensions suite in TLS mode (the userself/roleself tests expect
      https self links). The binary extension tests use the c8y-hello fixture
      (task build-extension-fixtures).
    deps: [install-test-dependencies, build-extension-fixtures]
    cmds:
      - go build -o .bin/c8y ./cmd/c8y
      - |
        for suite in extensions/example extensions/binary extensions/validate extensions/name extensions/extensions_create.yaml; do
          env PATH="$LOCAL_PATH" C8Y_OFFLINE_TLS=1 C8Y_OFFLINE_SUITE=manual ./tests/run-offline.sh "$suite" || exit 1
        done

  build-extension-fixtures:
    desc: Build the binary extension used by the extension tests (pkg/extsdk/examples/c8y-hello)
    dir: pkg/extsdk/examples/c8y-hello
    cmds:
      - go build -o bin/c8y-hello .

  test-extsdk:
    desc: Test the extension Go SDK (nested module pkg/extsdk) and build its example extension
    dir: pkg/extsdk
    cmds:
      - go vet ./...
      - go test ./...
      - go build -o examples/c8y-hello/bin/c8y-hello ./examples/c8y-hello

  test-installation:
    desc: Test installation of linux packages
    cmds:
      - chmod +x ./tools/integration-tests/run.sh
      - sudo ./tools/integration-tests/run.sh

  # ---------------------------------------------------------------
  # Release/Publish
  # ---------------------------------------------------------------
  release:
    desc: Publish release
    cmds:
      - git status
      - git diff
      - goreleaser release --clean --auto-snapshot

  release-extsdk:
    desc: "Tag a release of the extension Go SDK and push the tag. Usage: task release-extsdk -- v0.1.0"
    summary: |
      Tag a release of the extension Go SDK (pkg/extsdk/<version>) and push the tag.
      Only the git tag is needed, so don't create a GitHub release for it. No code change is
      needed either: c8y builds use the newest SDK tag in the Go extension template.
      See pkg/extsdk/README.md for the steps.

      Usage:
        task release-extsdk -- v0.1.0
        task release-extsdk REMOTE=upstream -- v0.1.0
    vars:
      VERSION: "{{.CLI_ARGS}}"
      REMOTE: '{{.REMOTE | default "origin"}}'
    preconditions:
      - sh: echo "{{.VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        msg: "Expected a version like v0.1.0. Usage: task release-extsdk -- v0.1.0"
    cmds:
      - task: test-extsdk
      - git tag "pkg/extsdk/{{.VERSION}}"
      - git push "{{.REMOTE}}" "pkg/extsdk/{{.VERSION}}"
      - echo "The next c8y build uses SDK {{.VERSION}} in the Go extension template"

  publish-powershell:
    desc: Publish powershell module
    cmds:
      - pwsh -File ./scripts/build-powershell/publish.ps1 -ArtifactFolder output_pwsh/PSc8y

  publish-linux-packages:
    desc: Publish linux packages (apk,deb,rpm)
    summary: |
      Publishing requires the JFROG_APIKEY to be set
    cmds:
      - chmod +x ./tools/publish-packages.sh
      - ./tools/publish-packages.sh ./dist

  # ---------------------------------------------------------------
  # Docker examples
  # ---------------------------------------------------------------
  run-docker-shell:
    desc: Run shell docker image
    interactive: true
    cmds:
      - |
        docker run -it --rm \
          -e C8Y_HOST=$C8Y_HOST \
          -e C8Y_TENANT=$C8Y_TENANT \
          -e C8Y_TOKEN=$C8Y_TOKEN \
          -e C8Y_USER=$C8Y_USER \
          -e C8Y_PASSWORD=$C8Y_PASSWORD \
          reubenmiller/c8y-shell

  run-docker-pwsh:
    desc: Run pwsh docker image
    interactive: true
    cmds:
      - |
        docker run -it --rm \
          -e C8Y_HOST=$C8Y_HOST \
          -e C8Y_TENANT=$C8Y_TENANT \
          -e C8Y_TOKEN=$C8Y_TOKEN \
          -e C8Y_USER=$C8Y_USER \
          -e C8Y_PASSWORD=$C8Y_PASSWORD \
          reubenmiller/c8y-pwsh
