name: build

on:
  push:
    branches: [ master, main, next, v2, v3 ]
    tags-ignore:
      - 'v*'
    paths-ignore:
      - docs/*
      - '**/*.md'
      - test/*.go

  pull_request:
    branches: [ master, main, next, v2, v3 ]

jobs:

  test-extensions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: pkg/extsdk/go.mod
        cache-dependency-path: pkg/extsdk/go.sum

    - name: Test extension SDK
      working-directory: pkg/extsdk
      run: |
        go vet ./...
        go test ./...
        go build -o examples/c8y-hello/bin/c8y-hello ./examples/c8y-hello

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        install-only: true

    # The extension SDK has its own (older) go version; the cli module needs its own
    - name: Set up Go (cli)
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        # The build job owns the cache for go.sum (it holds every cross-compiled
        # target); saving a smaller cache under the same key here would win the
        # race and leave the build job cold on every run
        cache: false

    # Scaffold binary extensions, build them against the local SDK, and check that the
    # GoReleaser archives match the format which "c8y extensions install" expects
    - name: Test binary extension install and scaffolding
      run: go test ./pkg/cmd/extension/ ./pkg/cmd/root/ ./pkg/extensions/...

  build:
    runs-on: ubuntu-latest

    steps:
    # free disk space due to avoid runner errors when it runs out of space
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        # dotnet, docker images and large packages are not used by this job;
        # a cold build of every target needs the space for the go build cache
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file:  go.mod
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: install tooling
      run: go install golang.org/x/tools/cmd/goimports@latest

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        install-only: true

    - name: Install Task
      uses: go-task/setup-task@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build cli
      run: task build-powershell build-snapshot
      shell: bash

    - uses: actions/upload-artifact@v6
      with:
        name: c8y.windows.amd64
        path: dist/windows_windows_amd64_v1/bin/c8y*
        if-no-files-found: error

    - uses: actions/upload-artifact@v6
      with:
        name: c8y.linux.amd64
        path: dist/linux_linux_amd64_v1/bin/c8y*
        if-no-files-found: error

    - uses: actions/upload-artifact@v6
      with:
        name: c8y.macos.amd64
        path: dist/macOS_darwin_amd64_v1/bin/c8y*
        if-no-files-found: error

    - uses: actions/upload-artifact@v6
      with:
        name: PSc8y Module
        path: output_pwsh/PSc8y/
        if-no-files-found: error

  test-offline:
    # The go unit tests, plus the dry-run cli tests (tests/auto) and the
    # supported manual tests against the go-c8y fake server. Needs no tenant or secrets,
    # so it also runs for fork PRs.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        # Not the shared setup-go cache: the build job owns that key (see
        # test-extensions). This job keeps its own, smaller cache.
        cache: false

    - name: Go cache (test-offline)
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: test-offline-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          test-offline-${{ runner.os }}-

    - name: Install Task
      uses: go-task/setup-task@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # All go tests of the main module (go test ./...). The cmd/tests packages
    # run against the fake server; they skip when C8Y_HOST is not set.
    - name: Go unit tests
      run: task test-go-offline
      shell: bash
      timeout-minutes: 20

    - name: Dry-run cli tests against the fake server
      run: task test-cli-offline
      shell: bash
      timeout-minutes: 30

    - name: Realtime cli tests against the fake server
      run: task test-cli-offline-realtime
      shell: bash
      timeout-minutes: 15

    - name: Manual cli tests against the fake server
      run: task test-cli-offline-manual
      shell: bash
      timeout-minutes: 30

    - name: Extension cli tests against the fake server
      run: task test-cli-offline-extensions
      shell: bash
      timeout-minutes: 15

  test-examples:
    runs-on: ${{ matrix.os }}
    needs: [build]
    # Skip for fork PRs and dependabot PRs — those lack secrets access and must
    # use the "/test" slash command instead (see slash-command-dispatch.yml).
    # PRs from branches within this repo run normally with secrets.
    # The v3 line (go-c8y v2 SDK) is verified offline by test-offline until its
    # known live-tenant differences are resolved; use "/test" to run it live.
    if: (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')) && github.ref_name != 'v3' && github.base_ref != 'v3'
    env:
      C8Y_HOST: ${{ secrets.C8Y_HOST }}
      C8Y_TENANT: ${{ secrets.C8Y_TENANT }}
      C8Y_USER: ${{ secrets.C8Y_USER }}
      C8Y_USERNAME: ${{ secrets.C8Y_USER }}
      C8Y_PASSWORD: ${{ secrets.C8Y_PASSWORD }}
      DEVICE_BOOTSTRAP_USER: ${{ secrets.DEVICE_BOOTSTRAP_USER }}
      DEVICE_BOOTSTRAP_PASSWORD: ${{ secrets.DEVICE_BOOTSTRAP_PASSWORD }}

      # Max timeout for each request (in milliseconds)
      C8Y_SETTINGS_DEFAULTS_TIMEOUT: 30000

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file:  go.mod

    - name: Install Task
      uses: go-task/setup-task@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/download-artifact@v7
      id: download
      with:
        name: c8y.linux.amd64
        path: /home/runner/.local/bin/

    - name: Test c8y examples
      if: ${{ true }}
      run: |
        mv /home/runner/.local/bin/c8y* /home/runner/.local/bin/c8y || true
        chmod +x /home/runner/.local/bin/c8y
        echo "/home/runner/.local/bin" >> $GITHUB_PATH
        c8y version
        c8y currentuser get --select id --debug
        task test-cli
      shell: bash
      timeout-minutes: 60

  test-pwsh:
    runs-on: ${{ matrix.os }}
    needs: [build]
    if: ${{ false }}
    env:
      C8Y_HOST: ${{ secrets.C8Y_HOST }}
      C8Y_TENANT: ${{ secrets.C8Y_TENANT }}
      C8Y_USER: ${{ secrets.C8Y_USER }}
      C8Y_PASSWORD: ${{ secrets.C8Y_PASSWORD }}
      DEVICE_BOOTSTRAP_USER: ${{ secrets.DEVICE_BOOTSTRAP_USER }}
      DEVICE_BOOTSTRAP_PASSWORD: ${{ secrets.DEVICE_BOOTSTRAP_PASSWORD }}

      # Max timeout for each request (in milliseconds)
      C8Y_SETTINGS_DEFAULTS_TIMEOUT: 30000

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file:  go.mod
    
    - name: Install Task
      uses: go-task/setup-task@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build powershell module
      run: task build-powershell build-snapshot
      shell: bash

    - name: Test powershell module
      if: ${{ true }}
      run: task test-powershell
      shell: bash
      timeout-minutes: 30

    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: tools/PSc8y/reports/*.xml

  publish-test-results:
    runs-on: ubuntu-latest
    needs: [test-pwsh]
    # Disabled as pester does not support junit reports (only nunit)
    if: always() && false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Get test results
        uses: actions/download-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results-${{ matrix.os }}

      - name: Publish results
        uses: EnricoMi/publish-unit-test-result-action@v1.1
        if: always()
        with:
          check_name: Test Results
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results-${{ matrix.os }}/*.xml
          log_level: DEBUG
