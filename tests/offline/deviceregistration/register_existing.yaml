# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/commander/feat/handle-nested-files/schema.json

tests:
  # The Cumulocity platform updates the credentials of a registered device
  # instead of failing, so this only runs against the fake server
  It fails for a device that exists:
    command: |
      id="dup_$(c8y template execute --template "_.Char(10)")"
      c8y deviceregistration register-basic --id "$id" >/dev/null
      c8y deviceregistration register-basic --id "$id"
      code=$?
      c8y devices delete --id "$id" --silentStatusCodes 404 >/dev/null
      exit $code
    exit-code: 101
    stderr:
      contains:
        - already exists
