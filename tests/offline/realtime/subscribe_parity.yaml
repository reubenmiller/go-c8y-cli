# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/commander/feat/handle-nested-files/schema.json
# The realtime commands of v2.59.0:
#   * --dry connects and streams for the whole --duration (v3 returned at once, showing the upgrade request)
#   * the websocket never verifies the certificate of the server, whatever the insecure setting
#     (the TLS tests need the fake server in TLS mode, see test-cli-offline-realtime in the Taskfile)
config:
  env:
    C8Y_SETTINGS_DEFAULTS_CACHE: false
    C8Y_SETTINGS_DEFAULTS_DRY: false

tests:
  It streams alarms of alarms subscribe in a dry run:
    command: ./offline/realtime/stream.sh alarms --dry
    exit-code: 0
    stdout:
      exactly: "exit=0 received=1 elapsed_ok=true"

  It streams the messages of realtime subscribe in a dry run:
    command: ./offline/realtime/stream.sh realtime --dry
    exit-code: 0
    stdout:
      exactly: "exit=0 received=1 elapsed_ok=true"

  It streams the messages of realtime subscribeAll in a dry run:
    command: ./offline/realtime/stream.sh subscribeAll --dry
    exit-code: 0
    stdout:
      exactly: "exit=0 received=1 elapsed_ok=true"

  It streams alarms without a dry run:
    command: ./offline/realtime/stream.sh alarms
    exit-code: 0
    stdout:
      exactly: "exit=0 received=1 elapsed_ok=true"

  It connects to the realtime websocket of a self-signed server when the insecure setting is off:
    command: ./offline/realtime/websocket_tls.sh realtime
    exit-code: 0
    stdout:
      contains:
        - "exit=0"

  It connects to the notification2 websocket of a self-signed server with the insecure setting on:
    command: ./offline/realtime/websocket_tls.sh notification2
    exit-code: 0
    stdout:
      contains:
        - "exit=0"

  --verbose of realtime subscribe logs the websocket as v2.59.0 did, in the CLI log format:
    command: |
      device=$(c8y devices create --name "ws-log-$RANDOM" --select id --output csv)
      c8y realtime subscribe --channel "/alarms/$device" --duration 2s --verbose 2>&1 >/dev/null | cut -f3- |
        sed -E "s#ws://[^ ]+#ws://HOST#; s#(ws \((send|recv)\): [^ ]+ : ).*#\1...#; s#/alarms/$device#/alarms/DEVICE#" |
        grep -E '^(Establishing connection|Waiting for message: id=1$|ws \((send|recv)\): /meta/handshake|Pending messages ids: 1$|Removing message from pending requests: 1$|Received message 1$|Resending /meta/connect heartbeat with 500 ms delay$|Listening to subscriptions|Subscribing to |Successfully subscribed to channel|Duration has expired)' |
        LC_ALL=C sort -u
      c8y realtime subscribe --channel "/alarms/$device" --duration 1s --verbose 2>&1 >/dev/null | grep -c -E 'level=(INFO|WARN|DEBUG)|component=realtime' || true
    exit-code: 0
    stdout:
      exactly: |
        Duration has expired. Stopping realtime client
        Establishing connection to ws://HOST
        Listening to subscriptions: /alarms/DEVICE
        Pending messages ids: 1
        Received message 1
        Removing message from pending requests: 1
        Resending /meta/connect heartbeat with 500 ms delay
        Subscribing to /alarms/DEVICE
        Successfully subscribed to channel /alarms/DEVICE
        Waiting for message: id=1
        ws (recv): /meta/handshake : ...
        ws (send): /meta/handshake : ...
        0

  Ctrl-C while the realtime websocket connects does not wait for the handshake:
    command: ./offline/realtime/interrupt.sh
    exit-code: 0
    stdout:
      exactly: "interrupted_in_time=true"
