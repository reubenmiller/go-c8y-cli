# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/commander/feat/handle-nested-files/schema.json
# --raw prints the response body as received, also when the response is a plain
# JSON array or its items are plucked from an envelope (not a paginated list).
tests:
    Raw output of a response which is a plain JSON array is the whole array:
        command: c8y tenantstatistics listSummaryAllTenants --raw
        exit-code: 0
        stdout:
            match-pattern: |
                ^\[\{.*\}\]$

    Output of a response which is a plain JSON array is one document per item:
        command: c8y tenantstatistics listSummaryAllTenants
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{.*\}$

    Raw output of a plain JSON array applies --select to each item:
        command: c8y tenantstatistics listSummaryAllTenants --raw --select deviceCount
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{"deviceCount":\d+\}$

    Raw output of an empty plain JSON array is []:
        command: c8y tenantstatistics listSummaryAllTenants --raw --filter 'deviceCount gt 999999999'
        exit-code: 0
        stdout:
            exactly: |
                []

    Raw output of a plain JSON array applies --filter to the elements and prints an array:
        command: c8y tenantstatistics listSummaryAllTenants --raw --filter 'deviceCount gt -1'
        exit-code: 0
        stdout:
            match-pattern: |
                ^\[\{.*\}\]$

    Raw output of an empty plain JSON array with --select prints nothing:
        command: c8y tenantstatistics listSummaryAllTenants --raw --filter 'deviceCount gt 999999999' --select deviceCount
        exit-code: 0
        stdout:
            exactly: ""

    Raw output of c8y api with a plain JSON array applies --filter to the elements:
        command: c8y api /tenant/statistics/allTenantsSummary --raw --filter 'deviceCount gt 999999999'
        exit-code: 0
        stdout:
            exactly: |
                []

    Raw output of an enveloped collection without items is the whole envelope:
        command: c8y api "/inventory/managedObjects?type=raw_no_such_type" --raw
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{.*"managedObjects":\[\].*\}$

    Raw output of a response with plucked items is the whole envelope:
        command: c8y microservices serviceusers get --id technician --raw
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{.*"users":\[\{.*\}\]\}$

    Raw output of a batched create is the response of each batch:
        command: |
          id=$(c8y devices create --name raw-bulk-device --select id -o csv)
          seq 1 3 | c8y measurements createBulk --device "$id" --type rawBulk --batchSize 2 --template "{nx_T: {v: {value: input.index}}}" --raw | c8y util show --select 'measurements.*.nx_T.v.value' -o csv | wc -l | tr -d ' '
          c8y devices delete --id "$id" >/dev/null
        exit-code: 0
        stdout:
            exactly: |
              2

    Raw output of c8y api with a plain JSON array applies --select to each element:
        command: c8y api /tenant/statistics/allTenantsSummary --raw --select deviceCount
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{"deviceCount":\d+\}$

    Raw output of c8y api with a plain JSON array applies --flatten to each element:
        command: c8y api /tenant/statistics/allTenantsSummary --raw --flatten
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{.*\}$

    Raw output of c8y api with an empty plain JSON array and --select prints nothing:
        command: c8y api /tenant/statistics/allTenantsSummary --raw --filter 'deviceCount gt 999999999' --select deviceCount
        exit-code: 0
        stdout:
            exactly: ""

    Raw output of features list is the array as received:
        command: c8y features list --raw
        exit-code: 0
        stdout:
            match-pattern: |
                ^\[\{.*\}\]$

    Output of features list is one document per feature:
        command: c8y features list
        exit-code: 0
        stdout:
            match-pattern: |
                ^\{.*\}
                \{.*\}$

    Raw output of ui applications plugins list is one document per plugin, so none prints nothing:
        command: c8y ui applications plugins list --application cockpit --raw | wc -c | tr -d ' '
        exit-code: 0
        stdout:
            exactly: |
                0

    Output of ui applications plugins list of an application without plugins prints nothing:
        command: c8y ui applications plugins list --application cockpit | wc -c | tr -d ' '
        exit-code: 0
        stdout:
            exactly: |
                0

    Raw output of the collections which are an array is the array as received:
        command: |
          c8y remoteaccess configurations list --device "$(c8y devices create --name raw-rac-device --select id -o csv)" --raw
        exit-code: 0
        stdout:
            match-pattern: |
                ^\[.*\]$
