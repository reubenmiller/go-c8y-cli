tests:
    features/tenants_disable_Disable a feature in the current tenant:
        command: c8y features tenants disable --key example --tenant t12345
        exit-code: 0
        stdout:
            json:
                method: PUT
                path: /features/example/by-tenant/t12345
    features/tenants_disable_Disable the feature when it is active on subtenants:
        command: $TEST_SHELL -c 'c8y features tenants list --key ui.datapoint-graph.v2 | c8y features tenants disable --key ui.datapoint-graph.v2'
        exit-code: 0
        skip: true
        stdout:
            json:
                method: PUT
                path: /features/{key}/by-tenant/$C8Y_TENANT
