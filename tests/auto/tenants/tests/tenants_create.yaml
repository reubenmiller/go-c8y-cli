tests:
    tenants_create_Create a new tenant (from the management tenant):
        command: c8y tenants create --name "mycompany" --domain "mycompany" --adminEmail "admin@example.com" --adminName "admin" --adminPass "mys3curep9d8"
        exit-code: 0
        stdout:
            json:
                body.adminEmail: admin@example.com
                body.adminName: admin
                body.adminPass: mys3curep9d8
                body.company: mycompany
                body.domain: mycompany
                method: POST
                path: /tenant/tenants
    tenants_create_Create a new tenant and send a password reset email (from the management tenant):
        command: c8y tenants create --name "mycompany" --domain "mycompany" --adminEmail "admin@example.com" --adminName "admin" --sendPasswordResetEmail
        exit-code: 0
        stdout:
            json:
                body.adminEmail: admin@example.com
                body.adminName: admin
                body.company: mycompany
                body.domain: mycompany
                body.sendPasswordResetEmail: "true"
                method: POST
                path: /tenant/tenants
