tests:
    It can create/update/delete an extension:
        command: ./manual/extensions/crud.sh
        exit-code: 0

    It completes the precompiled extension types:
        command: |
            c8y __complete extensions create myext --precompiled ""
        exit-code: 0
        stdout:
            contains:
                - "go\tGo extension using the extension SDK"
                - "other\tExtension in any language"
                - ":4"
