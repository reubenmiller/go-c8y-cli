# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/commander/feat/handle-nested-files/schema.json
config:
  env:
    C8Y_SETTINGS_DEFAULTS_DRY: true
    C8Y_SETTINGS_DEFAULTS_DRYFORMAT: json

tests:
  ? It sends an api request using a static URL and reference input in the body template
  : command: >
      echo "12345" | c8y api POST "/test/endpoint" --template "{value: input.value}" --dry
    exit-code: 0
    stdout:
      json:
        method: POST
        path: /test/endpoint
        body.value: "12345"

  It sends a POST request using a dynamic url:
    command: >
      echo "12345" | c8y api POST "/test/{url}/endpoint" --template "{value: input.value}" --dry
    exit-code: 0
    stdout:
      json:
        method: POST
        path: /test/12345/endpoint
        body.value: "12345"

  It supports pipeline input references:
    command: >
      echo "{\"myUrl\": \"/hello/world\"}" | c8y api GET --url -.myUrl --dry
    exit-code: 0
    stdout:
      json:
        method: GET
        path: /hello/world

  It sends a POST request using explicit url parameter:
    command: >
      echo "12345" | c8y api POST --url "/test/{url}/endpoint" --template "{value: input.value}" --dry
    exit-code: 0
    stdout:
      json:
        method: POST
        path: /test/12345/endpoint
        body.value: "12345"

  It sends a PUT request using piped json:
    command: >
      echo "{\"url\": \"12345\", \"name\":\"hello\"}" | c8y api --method PUT --url "/test/{url}/endpoint" --template "input.value" --dry
    exit-code: 0
    stdout:
      json:
        method: PUT
        path: /test/12345/endpoint
        body.name: "hello"
        body.url: "12345"

  It can pipe simple text to a url:
    command: >
      echo "1" | c8y api --method DELETE "/endpoint/%s" --dry
    exit-code: 0
    stdout:
      json:
        method: DELETE
        path: /endpoint/1

  It can pipe simple text to a url query parameters:
    command: >
      echo "1" | c8y api DELETE "/endpoint?id=%s" --dry
    exit-code: 0
    stdout:
      json:
        method: DELETE
        path: /endpoint
        query: id=1

  It sends a PUT request using piped json and a format style url template:
    command: >
      echo "{\"url\": \"12345\", \"name\":\"hello\"}" | c8y api --method PUT --url "/test/%s/endpoint" --template "input.value" --dry
    exit-code: 0
    stdout:
      json:
        method: PUT
        path: /test/12345/endpoint
        body.name: "hello"
        body.url: "12345"

  ? It sends a PUT request using piped json and a format style url template with multiple substitutions
  : command: >
      echo "{\"url\": \"12345\", \"name\":\"hello\"}" | c8y api --method PUT --url "/test/%s/endpoint/%s" --template "input.value" --dry
    exit-code: 0
    stdout:
      json:
        method: PUT
        path: /test/12345/endpoint/12345
        body.name: "hello"
        body.url: "12345"

  It sends a custom create alarm command:
    command: >
      c8y api POST "alarm/alarms" --data "text=one,severity=MAJOR,type=test_Type,time=2019-01-01,source.id='12345'" --keepProperties --dry
    exit-code: 0
    stdout:
      json:
        method: POST
        path: /alarm/alarms
        body.text: "one"
        body.severity: "MAJOR"
        body.type: "test_Type"
        body.time: "2019-01-01"
        body.source.id: "12345"

  It allows non-json bodies:
    command: |
      c8y api POST /myvalue --data "myvalue,41,outputtext" --contentType "text/plain"
    stdout:
      json:
        method: POST
        headers.Content-Type: text/plain
        path: /myvalue
        body: myvalue,41,outputtext
  
  It allows shorthand json bodies:
    command: |
      c8y api POST /myvalue --data "myvalue=1"
    stdout:
      json:
        method: POST
        path: /myvalue
        body.myvalue: '1'
  
  It accepts paths via pipeline:
    command: |
      echo "/inventory/managedObjects?pageSize=1&withTotalPages=true\n/application/applications?pageSize=2" |
        c8y api --compact |
        c8y util show --select path,query
    stdout:
      lines:
        1: '{"path":"/inventory/managedObjects","query":"pageSize=1&withTotalPages=true"}'
        2: '{"path":"/application/applications","query":"pageSize=2"}'

  It adds custom query parameters to an outgoing request:
    command: |
      echo "/inventory/managedObjects?pageSize=1" |
        c8y api --customQueryParam "myValue=2"
    stdout:
      json:
        method: GET
        path: /inventory/managedObjects
        query: myValue=2&pageSize=1

  It adds multiple custom query parameters to an outgoing request with the same key:
    command: |
      echo "/inventory/managedObjects?pageSize=1" |
        c8y api --customQueryParam "myValue=2" --customQueryParam "myValue=3" --customQueryParam other=value
    stdout:
      json:
        method: GET
        path: /inventory/managedObjects
        query: myValue=2&myValue=3&other=value&pageSize=1

  It accepts positional arguments for method and path (not using pipeline):
    command: |
      c8y api GET "/alarm/alarms?pageSize=10&status=ACTIVE"
    stdout:
      json:
        method: GET
        path: /alarm/alarms
        query: pageSize=10&status=ACTIVE

  It supports the pageSize flag:
    command: |
      c8y api /inventory/managedObjects --pageSize 10 --dry
    exit-code: 0
    stdout:
      json:
        query: pageSize=10

  It accepts positional arguments for path and defaults to GET (not using pipeline):
    command: |
      c8y api "/alarm/alarms"
    stdout:
      not-contains:
        - query
      json:
        method: GET
        path: /alarm/alarms

  It accepts positional path argument and explicit method:
    command: |
      c8y api "/alarm/alarms" --method post
    stdout:
      not-contains:
        - query
      json:
        method: POST
        path: /alarm/alarms
  It supports DELETE with a body:
      command: >
        c8y api --method delete --url "/inventory" --template "{value: 'one'}" --dry
      exit-code: 0
      stdout:
          json:
              method: DELETE
              path: /inventory
              body.value: one
  
  It supports DELETE without a body:
      command: >
        c8y api --method delete --url "/inventory" --dry --dryFormat markdown
      exit-code: 0
      stdout:
          contains:
            - DELETE /inventory
          not-contains:
            - Body
  
  It supports PATCH commands:
      command: >
        c8y api --method patch --url "/inventory" --dry
      exit-code: 0
      stdout:
          json:
              method: PATCH
              path: /inventory

  It encoded dates in query parameters:
      command: |
        c8y api --method GET --url /measurement/measurements --customQueryParam "dateFrom=2022-08-10T14:59:29.561+02:00" --dry=false
      exit-code: 0
      stdout:
        not-contains:
          - is not a valid date

  It creates an inventory via custom command:
      command: |
        c8y api POST /inventory/managedObjects --data name=test --select id,name --dry=false | c8y inventory delete
      exit-code: 0

  It supports a custom host flag without scheme:
      command: |
        c8y api --url "/inventory" --host localhost/service --dry
      exit-code: 0
      stdout:
          json:
              method: GET
              path: /service/inventory
              host: https://localhost

  It supports a custom host flag with only port number:
      command: |
        c8y api --url "/inventory" --host localhost:80/service --dry
      exit-code: 0
      stdout:
          json:
              method: GET
              path: /service/inventory
              host: http://localhost
  
  It supports a custom host flag with 443 port:
      command: |
        c8y api --url "/inventory" --host localhost:443/service --dry
      exit-code: 0
      stdout:
          json:
              method: GET
              path: /service/inventory
              host: https://localhost

  It supports a custom host flag with custom url with schema and port:
      command: |
        c8y api --url "/inventory" --host https://localhost:8080/service --dry
      exit-code: 0
      stdout:
          json:
              method: GET
              path: /service/inventory
              host: https://localhost:8080

  It supports returning errors that aren't in json:
    command: |
      c8y api -n GET '/path/to/myapi?id=supercoolid' --accept text/html --dry=false
    exit-code: 4
    stderr:
      contains:
        - <html>

  It supports custom query parameters on multipart formdata uploads:
    command: |
      c8y api -n POST '/path/to/myapi?id=supercoolid' --customQueryParam other=1 --formdata foo=bar --dry
    exit-code: 0
    stdout:
      json:
        method: POST
        pathEncoded: '/path/to/myapi?id=supercoolid&other=1'
        headers.Content-Type: r/multipart/form-data
        body: r/{"foo":"bar"}

  It preverves one trailing slash when present:
    command: |
      c8y api GET "/service/example/foo/" --dry
    exit-code: 0
    stdout:
      json:
        method: GET
        path: /service/example/foo/

  It sends custom form fields and files using curl style --form flags:
    command: |
      c8y api /example -F file=@manual/extensions/file1.txt -F parentAssetId=1111 -F assetTypeId=2222 --dry
    exit-code: 0
    stdout:
      json:
        method: POST
        path: /example
        headers.Content-Type: r/multipart/form-data
        body: 'r/name="assetTypeId"\r?\n\r?\n2222(.|\n)*name="file"; filename="file1.txt"(.|\n)*one\ntwo\nthree(.|\n)*name="parentAssetId"\r?\n\r?\n1111'

  It supports custom file options and file contents in form fields:
    command: |
      c8y api PUT /example --form "file=@manual/extensions/file1.txt;type=application/x-custom;filename=custom.txt" --form "notes=<manual/extensions/file1.txt" --dry
    exit-code: 0
    stdout:
      json:
        method: PUT
        body: 'r/name="file"; filename="custom.txt"\r?\nContent-Type: application/x-custom(.|\n)*name="notes"\r?\n\r?\none\ntwo\nthree'

  It sends the form data for every piped request:
    command: |
      printf "/a\n/b\n" | c8y api POST -F file=@manual/extensions/file1.txt -F name=example --dry --compact |
        c8y util show --select path,body -o csv
    exit-code: 0
    stdout:
      line-count: 2
      lines:
        1: 'r/^/a,.*three.*example'
        2: 'r/^/b,.*three.*example'

  It does not allow form fields to be used with a json body:
    command: |
      c8y api POST /example -F name=example --data "foo=bar" --dry
    exit-code: 101
    stderr:
      contains:
        - --form can not be used together with --data or --template

  It does not allow form fields to be used with a GET request:
    command: |
      c8y api GET /example -F name=example --dry
    exit-code: 101
    stderr:
      contains:
        - --form can not be used with a GET request

  It uploads binaries using form fields against a live tenant:
    command: ./manual/api/form_upload.sh
    exit-code: 0
