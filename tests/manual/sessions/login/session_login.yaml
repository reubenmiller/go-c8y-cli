# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/commander/feat/handle-nested-files/schema.json

tests:
  It reads a session from a command:
    command: |
      env -i PATH="$PATH" C8Y_HOST="$C8Y_HOST" C8Y_USERNAME="$C8Y_USERNAME" C8Y_PASSWORD="$C8Y_PASSWORD" \
        c8y sessions login --from-cmd "c8y sessions login --from-env --output-format json --no-banner" --output-format json
    exit-code: 0
    stdout:
      json:
        host: r/^.+$
        tenant: r/^.+$
        version: r/^.+$
        username: r/^.+$
        token: r/^.+$

  It decrypts an encrypted session file:
    command: |
      tmpdir=$(mktemp -d)
      export C8Y_PASSPHRASE="test-passphrase"
      password=$(c8y sessions encryptText --text "$C8Y_PASSWORD" --passphrase "$C8Y_PASSPHRASE" -n)
      printf '{"host":"%s","username":"%s","password":"%s"}' "$C8Y_HOST" "$C8Y_USERNAME" "$password" > "$tmpdir/session.json"
      env -i PATH="$PATH" C8Y_PASSPHRASE="$C8Y_PASSPHRASE" \
        c8y sessions login --from-file "$tmpdir/session.json" --output-format json --no-banner
      code=$?
      rm -rf "$tmpdir"
      exit $code
    exit-code: 0
    stdout:
      json:
        host: r/^.+$
        tenant: r/^.+$
        username: r/^.+$
        token: r/^.+$

  It reads a session from environment variables:
    command: |
      env -i PATH="$PATH" C8Y_HOST="$C8Y_HOST" C8Y_USERNAME="$C8Y_USERNAME" C8Y_PASSWORD="$C8Y_PASSWORD" \
        c8y sessions login --from-env --output-format json
    exit-code: 0
    stdout:
      json:
        host: r/^.+$
        tenant: r/^.+$
        version: r/^.+$
        username: r/^.+$
        token: r/^.+$

  It does not hide sensitive info in the session banner by default:
    command: |
      c8y sessions login --from-env
    exit-code: 0
    stderr:
      not-contains:
        - "{host}"
        - "{tenant}"
        - "{username}"
        - "hidden"

  It hides sensitive information in the session banner:
    command: |
      c8y sessions login --from-env
    exit-code: 0
    config:
      retries: 0
      inherit-env: false
      env:
        C8Y_SETTINGS_SESSION_HIDE: true
    stderr:
      contains:
        - "✓ Session is now active"
        - ---------------------  Cumulocity Session (sensitive info is hidden)  ---------------------
        - "{host}"
        - "tenant       : {tenant}"
        - "username     : {username}"
