tests:
    It creates a tenant option with an empty string value:
        command: >
          c8y tenantoptions update --category measurement.series.latestvalue --key c8y_Power.V --value "" --dry --dryFormat json |
           c8y util show --select body -c=false --output json
        exit-code: 0
        stdout:
            exactly: |
                {
                  "body": {
                    "value": ""
                  }
                }
    
    It creates a tenant option without a value:
        command: >
            c8y tenantoptions update --category measurement.series.latestvalue --key c8y_Power.V --dry --dryFormat json |
            c8y util show --select body -c=false --output json
        exit-code: 0
        stdout:
            exactly: |
                {
                  "body": {}
                }

    It encodes the path using url encoding:
        command: >
            c8y tenantoptions update --category measurement.series.latestvalue --key 'M#123.*' --dry --dryFormat json |
            c8y util show --select pathEncoded -c=false --output json
        exit-code: 0
        stdout:
            exactly: |
                {
                  "pathEncoded": "/tenant/options/measurement.series.latestvalue/M%23123.%2A"
                }

    It accepts url encoded values:
        command: >
            c8y tenantoptions update --category measurement.series.latestvalue --key 'M%23123.%2A' --dry --dryFormat json |
            c8y util show --select pathEncoded -c=false --output json
        exit-code: 0
        stdout:
            exactly: |
                {
                  "pathEncoded": "/tenant/options/measurement.series.latestvalue/M%23123.%2A"
                }
