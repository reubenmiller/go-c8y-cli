# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/commander/feat/handle-nested-files/schema.json

tests:
  It sets nested json objects via dot notation:
    command: |
      c8y devices create --name test --data "my.nested.value=1" --dry --dryFormat json
    exit-code: 0
    stdout:
      match-pattern: '{"c8y_IsDevice":{},"my":{"nested":{"value":1}},"name":"test"}'
      json:
        method: POST
        path: /inventory/managedObjects
        body.name: test
        body.c8y_IsDevice: '{}'
        body.my.nested.value: '1'

  It supports deleting properties using null value:
    command: |
      c8y devices update --id 12345 --data "my.nested.value=null" --dry --dryFormat json |
        c8y util show --select "body" --output json -c
    exit-code: 0
    stdout:
      exactly: |
        {"body":{"my":{"nested":{"value":null}}}}
  
  It supports values of different types:
    command: |
      c8y devices update --id 12345 --data "my.nested.float=1.234,my.nested.int=2,my.nested.neg_int=-2,my.nested.bool_true=true,my.nested.bool_false=false,my.nested.string=my name,my.nested.num_as_str='1.234'" --dry --dryFormat json |
        c8y util show --select "body" --output json -c=false
    exit-code: 0
    stdout:
      exactly: |
        {
          "body": {
            "my": {
              "nested": {
                "bool_false": false,
                "bool_true": true,
                "float": 1.234,
                "int": 2,
                "neg_int": -2,
                "num_as_str": "1.234",
                "string": "my name"
              }
            }
          }
        }

  It support multiple data flags:
    command: |
      c8y devices create --data name=MyDevice --data "subtypes=[linuxA,linuxB]" --data "my.value=1" --data "prop2=false" --dry --dryFormat json |
      c8y util show --select body --output json -c=false
    exit-code: 0
    stdout:
      exactly: |
        {
          "body": {
            "c8y_IsDevice": { },
            "my": { "value": 1 },
            "name": "MyDevice",
            "prop2": false,
            "subtypes": ["linuxA", "linuxB"]
          }
        }

  It should not panic when mixing data types:
    command: |
      c8y devices create -n --data one=1 --data one.two=null --dry
    exit-code: 101
    stderr:
      not-contains:
        - panic

  # https://github.com/reubenmiller/go-c8y-cli/issues/432
  It accepts a json array:
    command: |
      c8y api POST /example --data '[{"fragment": "myTemp", "series": "myT"}, {"fragment": "myWind", "series": "mySpeed"}]' --dry --dryFormat json
    exit-code: 0
    stdout:
      json:
        method: POST
        path: /example
        body.#: '2'
        body.0.fragment: myTemp
        body.0.series: myT
        body.1.fragment: myWind
        body.1.series: mySpeed

  It accepts a json array from file:
    command: |
      c8y api POST /example --data testdata/data_array.json --dry --dryFormat json
    exit-code: 0
    stdout:
      json:
        body.#: '2'
        body.0.fragment: myTemp
        body.1.series: mySpeed

  It accepts a json array of non-object values:
    command: |
      c8y api POST /example --data '["one", 2, true]' --dry --dryFormat json
    exit-code: 0
    stdout:
      json:
        body.#: '3'
        body.0: one
        body.1: '2'
        body.2: 'true'

  It applies a template on top of a json array:
    command: |
      c8y api POST /example --data '[{"a": 1}]' --template "[{b: 2}]" --dry --dryFormat json
    exit-code: 0
    stdout:
      json:
        body.#: '2'
        body.0.a: '1'
        body.1.b: '2'

  It removes Cumulocity properties from json array items:
    command: |
      c8y inventory create --data '[{"id": "1", "self": "https://example.com", "name": "one"}]' --dry --dryFormat json
    exit-code: 0
    stdout:
      json:
        body.#: '1'
        body.0.name: one
      not-contains:
        - '"id":'
        - '"self":'

  It sets a json array on a data flag with a destination property:
    command: |
      c8y bulkoperations create --group 1 --startDate 0s --creationRampSec 1 --operation '[1, 2]' --dry --dryFormat json
    exit-code: 0
    stdout:
      json:
        body.groupId: '1'
        body.operationPrototype.#: '2'
        body.operationPrototype.0: '1'

  It does not merge a json array with other data values:
    command: |
      c8y api POST /example --data '[{"a": 1}]' --data "b=2" --dry
    exit-code: 101
    stderr:
      contains:
        - A json array can only be used on its own

  It does not merge a json array with json object values:
    command: |
      c8y devices create --name test --data '[{"a": 1}]' --dry
    exit-code: 101
    stderr:
      contains:
        - A json array body can not be merged with json object values
      not-contains:
        - panic
